
- name: user-service
  url: http://user-service:8000
  routes:
    # service-to-service: the ai_service BFF fetching the account half of the
    # home aggregate. Gated by the shared secret rather than a browser JWT,
    # since the caller is another backend, not a session. Kept on its own
    # /internal prefix so it cannot be shadowed by the admin-gated
    # /api/v1/users route.
    - name: user-service-internal
      paths:
        - /internal/v1/users
      strip_path: false
      preserve_host: true
      plugins:
        - name: internal-secret-auth
          config:
            gateway_secret: "__GATEWAY_INTERNAL_SECRET__"
            internal_service: "home-bff"

    - name: user-service-v1-session
      paths:
        - /api/v1/auth/token/refresh/
        - /api/v1/auth/logout/
      strip_path: false
      preserve_host: true
      plugins:
        # session
        - name: rate-limiting
          route: user-service-v1-session
          config:
            minute: 60
            limit_by: ip
            policy: redis
            fault_tolerant: false
            redis_host: redis
            redis_port: 6379        

    - name: user-service-v1-email-verify
      paths:
        - /api/v1/auth/email/verify/
      strip_path: false
      preserve_host: true
      plugins:
        # email verification
        - name: rate-limiting
          route: user-service-v1-email-verify
          config:
            hour: 10
            limit_by: ip
            policy: redis
            fault_tolerant: false
            redis_host: redis
            redis_port: 6379
    - name: user-service-v1-email-verify-req
      paths:
        - /api/v1/auth/email/verify/request/
      strip_path: false
      preserve_host: true
      plugins:
        # email verification request
        - name: rate-limiting
          route: user-service-v1-email-verify-req
          config:
            hour: 5
            limit_by: ip
            policy: redis
            fault_tolerant: false
            redis_host: redis
            redis_port: 6379           

    - name: user-service-v1-email-login
      paths:
        - /api/v1/auth/email/login/
      strip_path: false
      preserve_host: true
      plugins:
        # email login
        - name: rate-limiting
          route: user-service-v1-email-login
          config:
            minute: 10
            limit_by: ip
            policy: redis
            fault_tolerant: false
            redis_host: redis
            redis_port: 6379

    - name: user-service-v1-phone-login-req
      paths:
        - /api/v1/auth/phone/login/request/
      strip_path: false
      preserve_host: true
      plugins:
        # phone login req
        - name: rate-limiting
          route: user-service-v1-phone-login-req
          config:
            hour: 5
            limit_by: ip
            policy: redis
            fault_tolerant: false
            redis_host: redis
            redis_port: 6379      

    - name: user-service-v1-phone-login
      paths:
        - /api/v1/auth/phone/login/verify/
      strip_path: false
      preserve_host: true
      plugins:
        # phone login
        - name: rate-limiting
          route: user-service-v1-phone-login
          config:
            minute: 10
            limit_by: ip
            policy: redis
            fault_tolerant: false
            redis_host: redis
            redis_port: 6379        

    - name: user-service-v1-password-forgot
      paths:
        - /api/v1/auth/password/forgot/
      strip_path: false
      preserve_host: true
      plugins:
        # password forgot req
        - name: rate-limiting
          route: user-service-v1-password-forgot
          config:
            hour: 5
            limit_by: ip
            policy: redis
            fault_tolerant: false
            redis_host: redis
            redis_port: 6379       

    - name: user-service-v1-password-reset
      paths:
        - /api/v1/auth/password/reset/
      strip_path: false
      preserve_host: true
      plugins:
        # password reset
        - name: rate-limiting
          route: user-service-v1-password-reset
          config:
            hour: 10
            limit_by: ip
            policy: redis
            fault_tolerant: false
            redis_host: redis
            redis_port: 6379          

    - name: user-service-v1-google
      paths:
        - /api/v1/auth/google/
      strip_path: false
      preserve_host: true
      plugins:
        # google oauth
        - name: rate-limiting
          route: user-service-v1-google
          config:
            minute: 10
            limit_by: ip
            policy: redis
            fault_tolerant: false
            redis_host: redis
            redis_port: 6379         

    - name: user-service-v1-users-public
      paths:
        - /api/v1/users/
      methods:
        - POST
      strip_path: false
      preserve_host: true

      # django admin
    - name: user-service-admin
      paths:
        - /api/admin/
      strip_path: false
      preserve_host: true
      plugins:
        - name: jwt
          config:
            claims_to_verify:
              - exp
            key_claim_name: iss
            cookie_names:
              - access_token

        - name: header_injector
          config:
            gateway_secret: "__GATEWAY_INTERNAL_SECRET__"

        # gateway-level gate in front of the Django admin login form:
        # only staff/admin callers reach it (Django still runs its own
        # session + staff check on top)
        - name: role-auth
          config:
            allowed_roles:
              - admin
              - staff

        - name: rate-limiting
          route: user-service-admin
          config:
            minute: 30
            limit_by: ip
            policy: redis
            fault_tolerant: false
            redis_host: redis
            redis_port: 6379

    # django static files
    - name: user-service-static
      paths:
        - /static/
      strip_path: false
      preserve_host: true

    - name: user-service-v1-protected
      paths:
        - /api/v1/auth
        - /api/v1/user
        - /api/v1/profile
      strip_path: false
      preserve_host: true
      plugins:
        - name: jwt
          config:
            claims_to_verify:
              - exp
            key_claim_name: iss
            cookie_names:
              - access_token

        - name: header_injector
          config:
            gateway_secret: "__GATEWAY_INTERNAL_SECRET__"
    
    # admin routes for the user app
    - name: admin-routes
      paths:
        - /api/v1/users/admin
      strip_path: false
      preserve_host: true
      plugins:
        - name: jwt
          config:
            claims_to_verify:
              - exp
            key_claim_name: iss
            cookie_names:
              - access_token

        - name: header_injector
          config:
            gateway_secret: "__GATEWAY_INTERNAL_SECRET__"
          
        - name: role-auth
          config:
            allowed_roles:
              - admin
              - staff

    - name: user-profile-view
      paths:
        - /api/v1/users/me
      strip_path: false
      preserve_host: true
      plugins:
        - name: jwt
          config:
            claims_to_verify:
              - exp
            key_claim_name: iss
            cookie_names:
              - access_token

        - name: header_injector
          config:
            gateway_secret: "__GATEWAY_INTERNAL_SECRET__"
            
    # admin routes for the user details
    - name: admin-route-user
      paths:
        - /api/v1/users
      strip_path: false
      preserve_host: true
      plugins:
        - name: jwt
          config:
            claims_to_verify:
              - exp
            key_claim_name: iss
            cookie_names:
              - access_token

        - name: header_injector
          config:
            gateway_secret: "__GATEWAY_INTERNAL_SECRET__"
          
        - name: role-auth
          config:
            allowed_roles:
              - admin
              - staff
    # admin route for auth related data
    - name: admin-route-auth-details
      paths:
        - /api/v1/auth/admin/
      strip_path: false
      preserve_host: true
      plugins:
        - name: jwt
          config:
            claims_to_verify:
              - exp
            key_claim_name: iss
            cookie_names:
              - access_token

        - name: header_injector
          config:
            gateway_secret: "__GATEWAY_INTERNAL_SECRET__"
          
        - name: role-auth
          config:
            allowed_roles:
              - admin
              - staff