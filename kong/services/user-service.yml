
- name: user-service
  url: http://user-service:8000
  routes:
    - name: user-service-v1-session
      paths:
        - /api/v1/auth/token/refresh/
        - /api/v1/auth/logout/
      strip_path: false
      preserve_host: true
      plugins:
        # session
        - name: rate-limiting
          route: user-service-v1-session
          config:
            minute: 60
            limit_by: ip
            policy: local        

    - name: user-service-v1-email-verify
      paths:
        - /api/v1/auth/email/verify/
      strip_path: false
      preserve_host: true
      plugins:
        # email verification
        - name: rate-limiting
          route: user-service-v1-email-verify
          config:
            hour: 10
            limit_by: ip
            policy: local          

    - name: user-service-v1-email-verify-req
      paths:
        - /api/v1/auth/email/verify/request/
      strip_path: false
      preserve_host: true
      plugins:
        # email verification request
        - name: rate-limiting
          route: user-service-v1-email-verify-req
          config:
            hour: 5
            limit_by: ip
            policy: local           

    - name: user-service-v1-email-login
      paths:
        - /api/v1/auth/email/login/
      strip_path: false
      preserve_host: true
      plugins:
        # email login
        - name: rate-limiting
          route: user-service-v1-email-login
          config:
            minute: 10
            limit_by: ip
            policy: local

    - name: user-service-v1-phone-login-req
      paths:
        - /api/v1/auth/phone/login/request/
      strip_path: false
      preserve_host: true
      plugins:
        # phone login req
        - name: rate-limiting
          route: user-service-v1-phone-login-req
          config:
            hour: 5
            limit_by: ip
            policy: local      

    - name: user-service-v1-phone-login
      paths:
        - /api/v1/auth/phone/login/verify/
      strip_path: false
      preserve_host: true
      plugins:
        # phone login
        - name: rate-limiting
          route: user-service-v1-phone-login
          config:
            minute: 10
            limit_by: ip
            policy: local        

    - name: user-service-v1-password-forgot
      paths:
        - /api/v1/auth/password/forgot/
      strip_path: false
      preserve_host: true
      plugins:
        # password forgot req
        - name: rate-limiting
          route: user-service-v1-password-forgot
          config:
            hour: 5
            limit_by: ip
            policy: local       

    - name: user-service-v1-password-reset
      paths:
        - /api/v1/auth/password/reset/
      strip_path: false
      preserve_host: true
      plugins:
        # password reset
        - name: rate-limiting
          route: user-service-v1-password-reset
          config:
            hour: 10
            limit_by: ip
            policy: local          

    - name: user-service-v1-google
      paths:
        - /api/v1/auth/google/
      strip_path: false
      preserve_host: true
      plugins:
        # google oauth
        - name: rate-limiting
          route: user-service-v1-google
          config:
            minute: 30
            limit_by: ip
            policy: local         

    - name: user-service-v1-users-public
      paths:
        - /api/v1/auth/users/
      methods:
        - POST
      strip_path: false
      preserve_host: true

    - name: user-service-v1-protected
      paths:
        - /api/v1/auth
        - /api/v1/user
        - /api/v1/profile
      strip_path: false
      preserve_host: true
      plugins:
        - name: jwt
          config:
            claims_to_verify:
              - exp
            key_claim_name: iss
            cookie_names:
              - access_token

        - name: header_injector
          config:
            gateway_secret: "__GATEWAY_INTERNAL_SECRET__"