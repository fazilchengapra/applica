
- name: notification-service
  url: http://notification_service:8000
  routes:
    - name: realtime-cv-status
      paths:
        - /api/v1/notifications/realtime/cv-status
      strip_path: false
      preserve_host: true

    - name: notification-dispatch-secure
      paths:
        - /api/v1/notifications
      strip_path: false
      preserve_host: true
      plugins:
        - name: internal-secret-auth
          config:
            gateway_secret: "__GATEWAY_INTERNAL_SECRET__"
    
    - name : websocket-connection
      paths:
        - /ws/notifications/
      strip_path: false
      preserve_host: true
      plugins:
        - name: jwt
          config:
            claims_to_verify:
              - exp
            key_claim_name: iss
            cookie_names:
              - access_token
        - name: header_injector
          config:
            gateway_secret: "__GATEWAY_INTERNAL_SECRET__"
